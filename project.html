<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Lynne</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root { --paper:#f5f5f2; --ink:#171717; --line:#bdbdb8; }
    body { font-family:Arial, "Microsoft YaHei", sans-serif; background:var(--paper); color:var(--ink); line-height:1.4; }
    a { color:inherit; text-decoration:none; }
    nav { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 42px; border-bottom:1px solid var(--line); }
    .logo { font-size:15px; letter-spacing:.04em; }
    .back { font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    main { padding:80px 42px 56px; }
    .label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.55; margin-bottom:30px; }
    h1 { font-size:clamp(62px, 11vw, 160px); font-weight:400; line-height:.83; letter-spacing:-.075em; }
    .meta { margin-top:70px; display:grid; grid-template-columns:repeat(3, 1fr); gap:30px; padding-top:22px; border-top:1px solid var(--line); font-size:13px; }
    .meta-label { font-size:11px; opacity:.55; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
    .placeholder { margin-top:90px; height:min(56vw, 700px); background:linear-gradient(135deg,#d8d8d3,#8f8f89); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.74); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .notes { max-width:650px; padding:90px 0 40px; font-size:clamp(22px,3vw,42px); line-height:1.08; letter-spacing:-.04em; }
    @media (max-width:768px) { nav {height:60px; padding:0 20px;} main {padding:60px 20px 40px;} .meta {grid-template-columns:1fr 1fr; gap:28px 20px; margin-top:52px;} .placeholder {margin-top:56px;height:62vw;} .notes {padding-top:62px;} }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">LYNNE0610</a>
    <a class="back" href="projects.html">← Project index</a>
  </nav>
  <main>
    <div class="label" id="category"></div>
    <h1 id="title"></h1>
    <div class="meta">
      <div><div class="meta-label">项目类型</div><div id="type"></div></div>
      <div><div class="meta-label">地点</div><div>待补充</div></div>
      <div><div class="meta-label">年份</div><div>待补充</div></div>
    </div>
    <div class="placeholder">Project image placeholder</div>
    <div class="notes">这里将用于展示项目介绍、设计概念、图片及图纸。你之后只需把资料和图片发给我，我会逐个替换完善。</div>
  </main>
  <script>
    const projects = [
      ['01','项目 01','景观设计'],['02','项目 02','景观设计'],['03','项目 03','景观设计'],['04','项目 04','景观设计'],
      ['05','项目 05','建筑设计'],['06','项目 06','建筑设计'],['07','项目 07','建筑设计'],['08','项目 08','建筑设计'],
      ['09','项目 09','室内设计'],['10','项目 10','室内设计'],['11','项目 11','室内设计'],['12','项目 12','室内设计'],
      ['13','项目 13','其他创意展示'],['14','项目 14','其他创意展示'],['15','项目 15','其他创意展示']
    ];
    const id = new URLSearchParams(window.location.search).get('id') || '01';
    const project = projects.find(function(item) { return item[0] === id; }) || projects[0];
    document.title = project[1] + ' — Lynne';
    document.getElementById('title').innerHTML = project[1].replace(' ', '<br>');
    document.getElementById('category').textContent = project[2] + ' / ' + project[0];
    document.getElementById('type').textContent = project[2];
  </script>
</body>
</html>
