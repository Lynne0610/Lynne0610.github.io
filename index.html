<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynne — Landscape Designer</title>
  <meta name="description" content="Lynne (林雍婕) — Landscape Designer Portfolio">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:Arial, "Microsoft YaHei", sans-serif; background:#f5f5f2; color:#171717; }
    a { color:inherit; text-decoration:none; }
    .cover { min-height:100%; position:relative; display:flex; align-items:center; justify-content:center; padding:32px; }
    .site-mark { position:absolute; top:28px; left:32px; font-size:14px; letter-spacing:.04em; }
    .site-note { position:absolute; right:32px; bottom:28px; font-size:11px; letter-spacing:.07em; text-transform:uppercase; opacity:.52; }
    .name-stage { text-align:center; position:relative; }
    .name-button { appearance:none; border:0; background:none; color:inherit; font:inherit; cursor:pointer; font-size:clamp(84px, 17vw, 250px); line-height:.78; font-weight:400; letter-spacing:-.095em; }
    .name-button:focus-visible { outline:1px solid #171717; outline-offset:14px; }
    .menu { max-height:0; overflow:hidden; opacity:0; display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:0; transition:max-height .45s ease, opacity .25s ease, padding-top .4s ease; }
    .name-stage:hover .menu, .name-stage:focus-within .menu, .name-stage.open .menu { max-height:210px; opacity:1; padding-top:32px; }
    .menu a { font-size:clamp(14px, 1.5vw, 19px); letter-spacing:.01em; line-height:1; position:relative; padding:4px 0; }
    .menu a::after { content:""; position:absolute; left:0; bottom:0; width:0; height:1px; background:currentColor; transition:width .25s ease; }
    .menu a:hover::after, .menu a:focus-visible::after { width:100%; }
    .menu a:focus-visible { outline:1px solid #171717; outline-offset:5px; }
    @media (max-width:768px) {
      .cover { padding:20px; }
      .site-mark { top:20px; left:20px; font-size:12px; }
      .site-note { right:20px; bottom:20px; font-size:9px; }
      .name-button { font-size:23vw; }
      .menu { gap:12px; }
    }
  </style>
</head>
<body>
  <main class="cover">
    <a class="site-mark" href="index.html">LYNNE0610</a>
    <div class="name-stage" id="nameStage">
      <button class="name-button" id="nameButton" type="button" aria-expanded="false" aria-controls="siteMenu">LYNNE</button>
      <nav class="menu" id="siteMenu" aria-label="Main navigation">
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
        <a href="others.html">Others</a>
        <a href="contact.html">Contact Me</a>
      </nav>
    </div>
    <div class="site-note">Hover over Lynne to explore</div>
  </main>
  <script>
    const stage = document.getElementById('nameStage');
    const button = document.getElementById('nameButton');
    button.addEventListener('click', function() {
      const isOpen = stage.classList.toggle('open');
      button.setAttribute('aria-expanded', String(isOpen));
    });
  </script>
</body>
</html>
